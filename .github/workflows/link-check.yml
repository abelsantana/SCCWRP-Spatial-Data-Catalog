name: Weekly link check

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (7:00 Pacific)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        run: python scripts/check_links.py | tee link-report.txt
      - name: Rebuild page
        run: python scripts/build_site.py
      - name: Commit status and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add catalog/link_status.json docs/index.html
          git diff --cached --quiet || git commit -m "Weekly link check $(date -u +%F)"
          git push
      - name: Open an issue for broken links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -Eq '^(BROKEN|ERROR|TIMEOUT)' link-report.txt; then
            gh issue create --title "Broken catalog links $(date -u +%F)" \
              --body "$(grep -E '^(BROKEN|ERROR|TIMEOUT)' link-report.txt)"
          fi
